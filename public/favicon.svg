<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="14" fill="hsl(172, 66%, 36%)" stroke="hsl(172, 66%, 30%)" stroke-width="2"/>
  
  <!-- Heart with ECG Line -->
  <path d="M16 20 C16 20, 12 16, 12 12 C12 10, 14 8, 16 10 C18 8, 20 10, 20 12 C20 16, 16 20, 16 20 Z" fill="white"/>
  
  <!-- ECG Line through heart -->
  <path d="M4 16 L8 16 L10 12 L12 20 L14 8 L16 16 L18 12 L20 20 L22 8 L24 16 L28 16" 
        stroke="white" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Plus Symbol (Medical) -->
  <g transform="translate(23, 23)">
    <circle cx="0" cy="0" r="4" fill="white" opacity="0.9"/>
    <path d="M-2 0 L2 0 M0 -2 L0 2" stroke="hsl(172, 66%, 36%)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
